<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeSkill OS</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050816;
    color: white;
    font-family: Arial, sans-serif;
}

canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050816;
    font-size: 22px;
}

#ui {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
}

.header {
    padding: 16px 20px;
    background: rgba(5,8,22,.85);
}

.logo {
    font-size: 23px;
    font-weight: bold;
}

.subtitle {
    color: #aab2cc;
    font-size: 13px;
    margin-top: 4px;
}

.goalBox {
    position: absolute;
    pointer-events: auto;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: min(650px, calc(100% - 30px));
    padding: 14px;
    border-radius: 18px;
    background: rgba(8,13,30,.94);
    border: 1px solid rgba(255,255,255,.15);
}

.goalBox input {
    width: 100%;
    padding: 14px;
    border-radius: 11px;
    border: 1px solid #303852;
    background: #10162a;
    color: white;
    font-size: 15px;
    outline: none;
}

.buttons {
    display: flex;
    gap: 8px;
}

button {
    border: 0;
    border-radius: 11px;
    padding: 13px 16px;
    margin-top: 9px;
    font-weight: bold;
    cursor: pointer;
}

#create {
    flex: 1;
}

#enterVR {
    display: none;
}

.panel {
    pointer-events: auto;
    position: absolute;
    left: 15px;
    bottom: 15px;
    width: min(410px, calc(100% - 30px));
    max-height: 60vh;
    overflow-y: auto;
    padding: 18px;
    border-radius: 18px;
    background: rgba(8,13,30,.95);
    border: 1px solid rgba(255,255,255,.15);
}

.hidden {
    display: none;
}

.mission {
    font-size: 19px;
    font-weight: bold;
}

.intent {
    margin-top: 6px;
    color: #aab2cc;
    font-size: 12px;
}

.info {
    color: #b5bdd5;
    font-size: 13px;
    line-height: 1.5;
}

.aiResult {
    margin-top: 12px;
    padding: 12px;
    border-radius: 12px;
    background: rgba(255,255,255,.06);
    color: #dce2f5;
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
}

.stats {
    display: flex;
    gap: 10px;
    margin: 14px 0;
}

.stat {
    flex: 1;
    padding: 11px;
    border-radius: 12px;
    background: rgba(255,255,255,.07);
    text-align: center;
}

.stat small {
    display: block;
    color: #9da6c0;
    margin-bottom: 5px;
}

.stat strong {
    font-size: 19px;
}

label {
    display: block;
    color: #b5bdd5;
    font-size: 13px;
    margin-top: 10px;
}

input[type=range] {
    width: 100%;
}

#message {
    margin-top: 10px;
    font-size: 14px;
    line-height: 1.45;
}

#status {
    color: #9da6c0;
    font-size: 12px;
    margin-top: 7px;
}

#start {
    width: 100%;
}
</style>
</head>

<body>

<div id="loading">
    ⚡ Loading LifeSkill OS...
</div>

<div id="ui">

    <div class="header">
        <div class="logo">⚡ LifeSkill OS</div>
        <div class="subtitle">
            Don't just learn it. Enter it.
        </div>
    </div>

    <div class="goalBox">

        <input
            id="goal"
            type="text"
            placeholder="What do you want to learn?"
        >

        <div class="buttons">

            <button id="create">
                🧠 CREATE EXPERIENCE
            </button>

            <button id="enterVR">
                🥽 ENTER VR
            </button>

        </div>

        <div id="status">
            Starting LifeSkill OS...
        </div>

    </div>

    <div id="panel" class="panel hidden">

        <div class="mission">
            🎯 <span id="missionTitle">Mission</span>
        </div>

        <div id="intent" class="intent"></div>

        <p id="missionInfo" class="info"></p>

        <div id="aiResult" class="aiResult hidden"></div>

        <div class="stats">

            <div class="stat">
                <small>Speed</small>
                <strong>
                    <span id="speed">0</span> m/s
                </strong>
            </div>

            <div class="stat">
                <small>Acceleration</small>
                <strong>
                    <span id="acc">5</span>
                </strong>
            </div>

        </div>

        <label>Acceleration</label>

        <input
            id="acceleration"
            type="range"
            min="0"
            max="10"
            value="5"
            step="0.1"
        >

        <button id="start">
            🚀 START EXPERIENCE
        </button>

        <div id="message">
            Your virtual experience is ready.
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<!-- Your LifeSkill OS intent engine -->
<script src="intent.js"></script>

<script>

window.addEventListener("load", startLifeSkillOS);

async function startLifeSkillOS() {

    const loading = document.getElementById("loading");
    const status = document.getElementById("status");

    if (typeof THREE === "undefined") {
        loading.innerHTML =
            "❌ 3D engine failed to load.";
        return;
    }

    /* =========================
       THREE.JS SCENE
    ========================= */

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x07101f);

    scene.fog = new THREE.Fog(
        0x07101f,
        30,
        200
    );

    const camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.1,
        500
    );

    camera.position.set(7, 5, 12);

    const renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.xr.enabled = true;

    document.body.appendChild(renderer.domElement);

    /* =========================
       LIGHTING
    ========================= */

    scene.add(
        new THREE.HemisphereLight(
            0xffffff,
            0x223344,
            2
        )
    );

    const sun = new THREE.DirectionalLight(
        0xffffff,
        3
    );

    sun.position.set(20, 30, 10);

    scene.add(sun);

    /* =========================
       GROUND
    ========================= */

    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(300, 300),
        new THREE.MeshStandardMaterial({
            color: 0x172019
        })
    );

    ground.rotation.x = -Math.PI / 2;

    scene.add(ground);

    /* =========================
       ROAD
    ========================= */

    const road = new THREE.Mesh(
        new THREE.PlaneGeometry(14, 240),
        new THREE.MeshStandardMaterial({
            color: 0x171a20
        })
    );

    road.rotation.x = -Math.PI / 2;
    road.position.set(0, 0.01, -80);

    scene.add(road);

    for (let z = 20; z > -210; z -= 8) {

        const line = new THREE.Mesh(
            new THREE.BoxGeometry(
                0.25,
                0.03,
                4
            ),
            new THREE.MeshStandardMaterial({
                color: 0xffffff
            })
        );

        line.position.set(0, 0.04, z);

        scene.add(line);
    }

    /* =========================
       CAR
    ========================= */

    const car = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(2.4, 0.7, 4),
        new THREE.MeshStandardMaterial({
            color: 0x1677ff,
            metalness: 0.4,
            roughness: 0.35
        })
    );

    body.position.y = 0.75;
    car.add(body);

    const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(1.7, 0.65, 1.8),
        new THREE.MeshStandardMaterial({
            color: 0x8fd3ff,
            transparent: true,
            opacity: 0.75
        })
    );

    cabin.position.set(0, 1.35, -0.25);
    car.add(cabin);

    const wheelGeometry =
        new THREE.CylinderGeometry(
            0.45,
            0.45,
            0.35,
            24
        );

    const wheelMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x080808
        });

    const wheelPositions = [
        [-1.25, 0.45, 1.25],
        [1.25, 0.45, 1.25],
        [-1.25, 0.45, -1.25],
        [1.25, 0.45, -1.25]
    ];

    wheelPositions.forEach(position => {

        const wheel = new THREE.Mesh(
            wheelGeometry,
            wheelMaterial
        );

        wheel.rotation.z = Math.PI / 2;

        wheel.position.set(
            position[0],
            position[1],
            position[2]
        );

        car.add(wheel);
    });

    car.position.set(0, 0, 10);

    scene.add(car);

    /* =========================
       TREES
    ========================= */

    function createTree(x, z) {

        const group = new THREE.Group();

        const trunk = new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.3,
                0.45,
                3,
                12
            ),
            new THREE.MeshStandardMaterial({
                color: 0x68452d
            })
        );

        trunk.position.y = 1.5;

        group.add(trunk);

        const leaves = new THREE.Mesh(
            new THREE.SphereGeometry(
                1.7,
                16,
                16
            ),
            new THREE.MeshStandardMaterial({
                color: 0x237a3a
            })
        );

        leaves.position.y = 3.5;

        group.add(leaves);

        group.position.set(x, 0, z);

        scene.add(group);
    }

    for (let z = 15; z > -210; z -= 15) {
        createTree(-11, z);
        createTree(11, z - 6);
    }

    /* =========================
       CHECKPOINT
    ========================= */

    const checkpoint = new THREE.Group();

    const checkpointMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xffff00,
            emissive: 0x665500
        });

    const ring = new THREE.Mesh(
        new THREE.TorusGeometry(
            5,
            0.25,
            16,
            64
        ),
        checkpointMaterial
    );

    ring.rotation.y = Math.PI / 2;
    ring.position.y = 4;

    checkpoint.add(ring);

    [-5, 5].forEach(x => {

        const pillar = new THREE.Mesh(
            new THREE.BoxGeometry(
                0.4,
                8,
                0.4
            ),
            checkpointMaterial
        );

        pillar.position.set(x, 4, 0);

        checkpoint.add(pillar);
    });

    checkpoint.position.z = -100;

    scene.add(checkpoint);

    /* =========================
       UI REFERENCES
    ========================= */

    const goal =
        document.getElementById("goal");

    const create =
        document.getElementById("create");

    const enterVR =
        document.getElementById("enterVR");

    const panel =
        document.getElementById("panel");

    const missionTitle =
        document.getElementById("missionTitle");

    const intent =
        document.getElementById("intent");

    const missionInfo =
        document.getElementById("missionInfo");

    const aiResult =
        document.getElementById("aiResult");

    const speedText =
        document.getElementById("speed");

    const accText =
        document.getElementById("acc");

    const slider =
        document.getElementById("acceleration");

    const start =
        document.getElementById("start");

    const message =
        document.getElementById("message");

    loading.style.display = "none";

    status.textContent =
        "📱 3D environment ready.";

    /* =========================
       VR
    ========================= */

    if (navigator.xr) {

        navigator.xr
            .isSessionSupported("immersive-vr")
            .then(supported => {

                if (supported) {

                    enterVR.style.display = "block";

                    status.textContent =
                        "🥽 VR headset detected.";

                }

            })
            .catch(() => {});

    }

    enterVR.addEventListener(
        "click",
        async () => {

            try {

                const session =
                    await navigator.xr.requestSession(
                        "immersive-vr",
                        {
                            optionalFeatures: [
                                "local-floor",
                                "bounded-floor"
                            ]
                        }
                    );

                await renderer.xr.setSession(session);

                status.textContent =
                    "🥽 You are inside LifeSkill OS.";

            } catch (error) {

                console.error(error);

                status.textContent =
                    "VR could not start.";

            }
        }
    );

    /* =========================
       AI EXPERIENCE
    ========================= */

    create.addEventListener(
        "click",
        async () => {

            const text =
                goal.value.trim();

            if (!text) {

                alert(
                    "Tell LifeSkill OS what you want to learn."
                );

                return;
            }

            create.disabled = true;

            create.textContent =
                "🧠 CREATING...";

            status.textContent =
                "🧠 AI is designing your experience...";

            panel.classList.remove("hidden");

            /*
             * First use local intent.js
             */

            let localExperience;

            if (typeof understandIntent === "function") {

                localExperience =
                    understandIntent(text);

            } else {

                localExperience = {
                    category: "lifeSkills",
                    goal: text
                };
            }

            missionTitle.textContent =
                "AI Experience";

            intent.textContent =
                "Category: " +
                (localExperience.category || "Life Skill");

            missionInfo.textContent =
                "LifeSkill OS is connecting to the AI experience engine...";

            aiResult.classList.add("hidden");

            /*
             * Send the goal to Render/FastAPI
             */

            try {

                const response =
                    await fetch(
                        "https://openflow-api.onrender.com/experience",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                goal: text
                            })
                        }
                    );

                if (!response.ok) {

                    throw new Error(
                        "Backend returned " +
                        response.status
                    );
                }

                const data =
                    await response.json();

                if (!data.success) {

                    throw new Error(
                        "AI experience was not created."
                    );
                }

                missionTitle.textContent =
                    "Your AI Mission";

                intent.textContent =
                    "🧠 OpenAI • " +
                    (localExperience.category ||
                     "Life Skill");

                missionInfo.textContent =
                    "Your personalized experience has been generated.";

                aiResult.textContent =
                    data.experience;

                aiResult.classList.remove(
                    "hidden"
                );

                message.textContent =
                    "🚀 Your AI experience is ready.";

                status.textContent =
                    "✅ AI experience generated.";

            } catch (error) {

                console.error(error);

                missionInfo.textContent =
                    "The 3D environment is ready, but the AI server could not be reached.";

                message.textContent =
                    "⚠️ Check that your Render backend is deployed.";

                status.textContent =
                    "⚠️ AI connection failed.";

            }

            create.disabled = false;

            create.textContent =
                "🧠 CREATE EXPERIENCE";
        }
    );

    /* =========================
       ACCELERATION
    ========================= */

    slider.addEventListener(
        "input",
        () => {

            acceleration =
                Number(slider.value);

            accText.textContent =
                acceleration.toFixed(1);
        }
    );

    /* =========================
       EXPERIENCE STATE
    ========================= */

    let speed = 0;
    let acceleration = 5;
    let running = false;
    let lastTime = performance.now();

    start.addEventListener(
        "click",
        () => {

            running = !running;

            if (running) {

                start.textContent =
                    "⏸ PAUSE EXPERIENCE";

                message.textContent =
                    "🚀 Experience running...";

            } else {

                start.textContent =
                    "🚀 START EXPERIENCE";

                message.textContent =
                    "Experience paused.";
            }
        }
    );

    /* =========================
       ANIMATION
    ========================= */

    function animate(time) {

        requestAnimationFrame(animate);

        const delta =
            Math.min(
                (time - lastTime) / 1000,
                0.05
            );

        lastTime = time;

        if (running) {

            speed +=
                acceleration * delta;

            speed =
                Math.min(speed, 40);

            car.position.z -=
                speed * delta;

            if (car.position.z < -110) {

                car.position.z = 10;

                speed = 0;

                message.textContent =
                    "🏁 Checkpoint reached!";
            }
        }

        speedText.textContent =
            speed.toFixed(1);

        const targetZ =
            car.position.z + 12;

        camera.position.z +=
            (targetZ - camera.position.z) *
            0.04;

        camera.lookAt(
            car.position.x,
            1.5,
            car.position.z - 10
        );

        renderer.render(
            scene,
            camera
        );
    }

    animate(performance.now());

    /* =========================
       RESIZE
    ========================= */

    window.addEventListener(
        "resize",
        () => {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        }
    );

    /* =========================
       ENTER KEY
    ========================= */

    goal.addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                create.click();
            }
        }
    );
}

</script>

</body>
</html>
