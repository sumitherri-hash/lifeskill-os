<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeSkill OS 3D</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
overflow:hidden;
font-family:Arial,sans-serif;
background:#050816;
color:white
}

#loading{
position:fixed;
inset:0;
z-index:100;
display:flex;
align-items:center;
justify-content:center;
background:#050816;
font-size:22px
}

#ui{
position:fixed;
z-index:10;
top:0;
left:0;
width:100%;
pointer-events:none
}

.header{
padding:18px;
background:rgba(5,8,22,.85)
}

.logo{
font-size:22px;
font-weight:bold
}

.subtitle{
color:#aab2cc;
font-size:13px;
margin-top:5px
}

.panel{
pointer-events:auto;
position:fixed;
left:15px;
bottom:15px;
width:min(370px,calc(100% - 30px));
padding:18px;
border-radius:18px;
background:rgba(8,13,30,.9);
border:1px solid rgba(255,255,255,.15)
}

.mission{
font-size:18px;
font-weight:bold;
margin-bottom:8px
}

.info{
color:#b5bdd5;
font-size:13px;
line-height:1.5
}

.stats{
display:flex;
gap:10px;
margin:15px 0
}

.stat{
flex:1;
padding:12px;
border-radius:12px;
background:rgba(255,255,255,.07);
text-align:center
}

.stat small{
display:block;
color:#9da6c0;
margin-bottom:5px
}

.stat strong{
font-size:20px
}

input[type=range]{
width:100%
}

button{
width:100%;
margin-top:12px;
padding:14px;
border:0;
border-radius:12px;
font-weight:bold;
cursor:pointer
}

#message{
margin-top:12px;
font-size:14px;
line-height:1.4
}
</style>
</head>

<body>

<div id="loading">⚡ Loading LifeSkill OS...</div>

<div id="ui">

<div class="header">
<div class="logo">⚡ LifeSkill OS</div>
<div class="subtitle">Don't just learn it. Enter it.</div>
</div>

<div class="panel">

<div class="mission">
🎯 Mission 01 — Master Motion
</div>

<div class="info">
Control the vehicle and discover how acceleration changes motion.
</div>

<div class="stats">

<div class="stat">
<small>Speed</small>
<strong><span id="speed">0</span> m/s</strong>
</div>

<div class="stat">
<small>Acceleration</small>
<strong><span id="acc">5</span></strong>
</div>

</div>

<label>Acceleration</label>

<input
id="acceleration"
type="range"
min="0"
max="10"
value="5"
step="0.1">

<button id="start">
🚀 START MISSION
</button>

<div id="message">
Experiment with acceleration and observe what happens.
</div>

</div>
</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

window.addEventListener("load", function(){

if(typeof THREE === "undefined"){

document.getElementById("loading").innerHTML =
"❌ 3D engine could not load.<br><small>Check your internet connection.</small>";

return;

}


/* SCENE */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x07101f);

scene.fog =
new THREE.Fog(
0x07101f,
30,
180
);


/* CAMERA */

const camera =
new THREE.PerspectiveCamera(
60,
window.innerWidth /
window.innerHeight,
0.1,
500
);

camera.position.set(
8,6,12
);


/* RENDERER */

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setPixelRatio(
Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.shadowMap.enabled =
true;

document.body.appendChild(
renderer.domElement
);


/* LIGHT */

const light =
new THREE.HemisphereLight(
0xffffff,
0x223344,
2
);

scene.add(light);


const sun =
new THREE.DirectionalLight(
0xffffff,
3
);

sun.position.set(
20,30,10
);

sun.castShadow = true;

scene.add(sun);


/* GROUND */

const ground =
new THREE.Mesh(
new THREE.PlaneGeometry(
300,300
),
new THREE.MeshStandardMaterial({
color:0x172019
})
);

ground.rotation.x =
-Math.PI/2;

scene.add(ground);


/* ROAD */

const road =
new THREE.Mesh(
new THREE.PlaneGeometry(
14,220
),
new THREE.MeshStandardMaterial({
color:0x171a20
})
);

road.rotation.x =
-Math.PI/2;

road.position.y =
0.01;

road.position.z =
-80;

scene.add(road);


/* ROAD MARKINGS */

for(
let z=20;
z>-200;
z-=8
){

const line =
new THREE.Mesh(
new THREE.BoxGeometry(
0.25,0.03,4
),
new THREE.MeshStandardMaterial({
color:0xffffff
})
);

line.position.set(
0,0.04,z
);

scene.add(line);

}


/* CAR */

const car =
new THREE.Group();


const body =
new THREE.Mesh(
new THREE.BoxGeometry(
2.4,0.7,4
),
new THREE.MeshStandardMaterial({
color:0x1677ff,
metalness:0.4,
roughness:0.35
})
);

body.position.y =
0.75;

car.add(body);


const cabin =
new THREE.Mesh(
new THREE.BoxGeometry(
1.7,0.65,1.8
),
new THREE.MeshStandardMaterial({
color:0x8fd3ff,
transparent:true,
opacity:0.75
})
);

cabin.position.set(
0,1.35,-0.25
);

car.add(cabin);


/* WHEELS */

const wheelGeometry =
new THREE.CylinderGeometry(
0.45,
0.45,
0.35,
24
);

const wheelMaterial =
new THREE.MeshStandardMaterial({
color:0x080808
});

[
[-1.25,0.45,1.25],
[1.25,0.45,1.25],
[-1.25,0.45,-1.25],
[1.25,0.45,-1.25]
].forEach(p=>{

const wheel =
new THREE.Mesh(
wheelGeometry,
wheelMaterial
);

wheel.rotation.z =
Math.PI/2;

wheel.position.set(
p[0],p[1],p[2]
);

car.add(wheel);

});


car.position.set(
0,0,10
);

scene.add(car);


/* CHECKPOINT */

const checkpoint =
new THREE.Group();


const ring =
new THREE.Mesh(
new THREE.TorusGeometry(
5,0.25,16,64
),
new THREE.MeshStandardMaterial({
color:0xffff00,
emissive:0x665500
})
);

ring.rotation.y =
Math.PI/2;

ring.position.y =
4;

checkpoint.add(ring);


[-5,5].forEach(x=>{

const pillar =
new THREE.Mesh(
new THREE.BoxGeometry(
0.4,8,0.4
),
new THREE.MeshStandardMaterial({
color:0xffff00,
emissive:0x665500
})
);

pillar.position.set(
x,4,0
);

checkpoint.add(pillar);

});


checkpoint.position.z =
-100;

scene.add(checkpoint);


/* TREES */

function tree(x,z){

const group =
new THREE.Group();


const trunk =
new THREE.Mesh(
new THREE.CylinderGeometry(
0.3,0.45,3,12
),
new THREE.MeshStandardMaterial({
color:0x68452d
})
);

trunk.position.y =
1.5;

group.add(trunk);


const leaves =
new THREE.Mesh(
new THREE.SphereGeometry(
1.7,16,16
),
new THREE.MeshStandardMaterial({
color:0x237a3a
})
);

leaves.position.y =
3.5;

group.add(leaves);

group.position.set(
x,0,z
);

scene.add(group);

}


for(
let z=15;
z>-190;
z-=15
){

tree(-11,z);
tree(11,z-6);

}


/* GAME */

let speed = 0;
let acceleration = 5;
let running = false;
let lastTime = performance.now();


const slider =
document.getElementById(
"acceleration"
);

const speedText =
document.getElementById(
"speed"
);

const accText =
document.getElementById(
"acc"
);

const message =
document.getElementById(
"message"
);

const start =
document.getElementById(
"start"
);


slider.addEventListener(
"input",
function(){

acceleration =
Number(slider.value);

accText.textContent =
acceleration.toFixed(1);

});


start.addEventListener(
"click",
function(){

running = true;

speed = 0;

car.position.z = 10;

message.textContent =
"🚀 Mission started! Watch how changing acceleration changes the vehicle's motion.";

start.textContent =
"🔄 RESTART MISSION";

});


/* ANIMATION */

function animate(){

requestAnimationFrame(
animate
);

const now =
performance.now();

const delta =
Math.min(
(now-lastTime)/1000,
0.05
);

lastTime = now;


if(running){

speed +=
acceleration*delta;

speed =
Math.min(
speed,
30
);

car.position.z -=
speed*delta;

speedText.textContent =
speed.toFixed(1);


if(car.position.z <= -95){

running = false;

message.textContent =
"🏆 Mission complete! You discovered how acceleration changes motion.";

}

}


/* FOLLOW CAMERA */

camera.position.z +=
(
car.position.z + 12 -
camera.position.z
)*0.04;

camera.lookAt(
car.position.x,
1,
car.position.z-15
);


renderer.render(
scene,
camera
);

}


animate();


/* REMOVE LOADING */

document.getElementById(
"loading"
).style.display =
"none";


/* RESIZE */

window.addEventListener(
"resize",
function(){

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});

});

</script>

</body>
</html>
