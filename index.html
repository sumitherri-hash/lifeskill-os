<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>LifeSkill OS</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050816;
    color:white;
    font-family:Arial,sans-serif;
}

#loading{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050816;
    font-size:22px;
}

#ui{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
}

.header{
    padding:16px 20px;
    background:rgba(5,8,22,.85);
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.subtitle{
    color:#aab2cc;
    font-size:13px;
    margin-top:4px;
}

.goalBox{
    position:absolute;
    pointer-events:auto;
    top:80px;
    left:50%;
    transform:translateX(-50%);
    width:min(650px,calc(100% - 30px));
    padding:14px;
    border-radius:18px;
    background:rgba(8,13,30,.92);
    border:1px solid rgba(255,255,255,.15);
}

.goalBox input{
    width:100%;
    padding:14px;
    border-radius:11px;
    border:1px solid #303852;
    background:#10162a;
    color:white;
    font-size:15px;
    outline:none;
}

.buttons{
    display:flex;
    gap:8px;
}

button{
    border:0;
    border-radius:11px;
    padding:13px 16px;
    margin-top:9px;
    font-weight:bold;
    cursor:pointer;
}

#create{
    flex:1;
}

#enterVR{
    display:none;
}

.panel{
    pointer-events:auto;
    position:absolute;
    left:15px;
    bottom:15px;
    width:min(390px,calc(100% - 30px));
    padding:18px;
    border-radius:18px;
    background:rgba(8,13,30,.92);
    border:1px solid rgba(255,255,255,.15);
}

.hidden{
    display:none;
}

.mission{
    font-size:19px;
    font-weight:bold;
}

.intent{
    margin-top:6px;
    color:#aab2cc;
    font-size:12px;
}

.info{
    color:#b5bdd5;
    font-size:13px;
    line-height:1.5;
}

.stats{
    display:flex;
    gap:10px;
    margin:14px 0;
}

.stat{
    flex:1;
    padding:11px;
    border-radius:12px;
    background:rgba(255,255,255,.07);
    text-align:center;
}

.stat small{
    display:block;
    color:#9da6c0;
    margin-bottom:5px;
}

.stat strong{
    font-size:19px;
}

label{
    display:block;
    color:#b5bdd5;
    font-size:13px;
    margin-top:10px;
}

input[type=range]{
    width:100%;
}

#message{
    margin-top:10px;
    font-size:14px;
    line-height:1.45;
}

#status{
    color:#9da6c0;
    font-size:12px;
    margin-top:7px;
}

</style>
</head>


<body>


<div id="loading">
    ⚡ Loading LifeSkill OS...
</div>


<div id="ui">

    <div class="header">

        <div class="logo">
            ⚡ LifeSkill OS
        </div>

        <div class="subtitle">
            Don't just learn it. Enter it.
        </div>

    </div>


    <div class="goalBox">

        <input
            id="goal"
            type="text"
            placeholder="What do you want to learn?"
        >

        <div class="buttons">

            <button id="create">
                🧠 CREATE EXPERIENCE
            </button>

            <button id="enterVR">
                🥽 ENTER VR
            </button>

        </div>

        <div id="status">
            Starting 3D environment...
        </div>

    </div>


    <div id="panel" class="panel hidden">

        <div class="mission">
            🎯 <span id="missionTitle">
                Mission
            </span>
        </div>

        <div
            id="intent"
            class="intent">
        </div>

        <p
            id="missionInfo"
            class="info">
        </p>


        <div class="stats">

            <div class="stat">

                <small>
                    Speed
                </small>

                <strong>
                    <span id="speed">
                        0
                    </span>
                    m/s
                </strong>

            </div>


            <div class="stat">

                <small>
                    Acceleration
                </small>

                <strong>
                    <span id="acc">
                        5
                    </span>
                </strong>

            </div>

        </div>


        <label>
            Acceleration
        </label>

        <input
            id="acceleration"
            type="range"
            min="0"
            max="10"
            value="5"
            step="0.1"
        >


        <button id="start">
            🚀 START EXPERIENCE
        </button>


        <div id="message">
            Your virtual experience is ready.
        </div>

    </div>

</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

window.addEventListener(
    "load",
    startLifeSkillOS
);


function startLifeSkillOS(){

    /* =========================================
       CHECK THREE.JS
    ========================================= */

    if(
        typeof THREE === "undefined"
    ){

        document.getElementById(
            "loading"
        ).innerHTML =
        "❌ 3D engine failed to load.<br>" +
        "<small>Please refresh the page.</small>";

        return;
    }


    /* =========================================
       SCENE
    ========================================= */

    const scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(
            0x07101f
        );

    scene.fog =
        new THREE.Fog(
            0x07101f,
            30,
            200
        );


    /* =========================================
       CAMERA
    ========================================= */

    const camera =
        new THREE.PerspectiveCamera(
            70,
            window.innerWidth /
            window.innerHeight,
            0.1,
            500
        );

    camera.position.set(
        7,
        5,
        12
    );


    /* =========================================
       RENDERER
    ========================================= */

    const renderer =
        new THREE.WebGLRenderer({
            antialias:true
        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.xr.enabled =
        true;

    document.body.appendChild(
        renderer.domElement
    );


    /* =========================================
       LIGHTING
    ========================================= */

    const light =
        new THREE.HemisphereLight(
            0xffffff,
            0x223344,
            2
        );

    scene.add(light);


    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    sun.position.set(
        20,
        30,
        10
    );

    scene.add(sun);


    /* =========================================
       GROUND
    ========================================= */

    const ground =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                300,
                300
            ),

            new THREE.MeshStandardMaterial({
                color:0x172019
            })

        );

    ground.rotation.x =
        -Math.PI / 2;

    scene.add(ground);


    /* =========================================
       ROAD
    ========================================= */

    const road =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                14,
                240
            ),

            new THREE.MeshStandardMaterial({
                color:0x171a20
            })

        );

    road.rotation.x =
        -Math.PI / 2;

    road.position.set(
        0,
        .01,
        -80
    );

    scene.add(road);


    /* =========================================
       ROAD LINES
    ========================================= */

    for(
        let z = 20;
        z > -210;
        z -= 8
    ){

        const line =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .25,
                    .03,
                    4
                ),

                new THREE.MeshStandardMaterial({
                    color:0xffffff
                })

            );

        line.position.set(
            0,
            .04,
            z
        );

        scene.add(line);
    }


    /* =========================================
       CAR
    ========================================= */

    const car =
        new THREE.Group();


    const body =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.4,
                .7,
                4
            ),

            new THREE.MeshStandardMaterial({
                color:0x1677ff,
                metalness:.4,
                roughness:.35
            })

        );

    body.position.y =
        .75;

    car.add(body);


    const cabin =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.7,
                .65,
                1.8
            ),

            new THREE.MeshStandardMaterial({
                color:0x8fd3ff,
                transparent:true,
                opacity:.75
            })

        );

    cabin.position.set(
        0,
        1.35,
        -.25
    );

    car.add(cabin);


    /* =========================================
       WHEELS
    ========================================= */

    const wheelGeometry =
        new THREE.CylinderGeometry(
            .45,
            .45,
            .35,
            24
        );

    const wheelMaterial =
        new THREE.MeshStandardMaterial({
            color:0x080808
        });


    const wheelPositions = [

        [-1.25,.45,1.25],
        [1.25,.45,1.25],
        [-1.25,.45,-1.25],
        [1.25,.45,-1.25]

    ];


    wheelPositions.forEach(
        function(position){

            const wheel =
                new THREE.Mesh(
                    wheelGeometry,
                    wheelMaterial
                );

            wheel.rotation.z =
                Math.PI / 2;

            wheel.position.set(
                position[0],
                position[1],
                position[2]
            );

            car.add(wheel);

        }
    );


    car.position.set(
        0,
        0,
        10
    );

    scene.add(car);


    /* =========================================
       TREES
    ========================================= */

    function tree(x,z){

        const group =
            new THREE.Group();


        const trunk =
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    .3,
                    .45,
                    3,
                    12
                ),

                new THREE.MeshStandardMaterial({
                    color:0x68452d
                })

            );

        trunk.position.y =
            1.5;

        group.add(trunk);


        const leaves =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    1.7,
                    16,
                    16
                ),

                new THREE.MeshStandardMaterial({
                    color:0x237a3a
                })

            );

        leaves.position.y =
            3.5;

        group.add(leaves);


        group.position.set(
            x,
            0,
            z
        );

        scene.add(group);

    }


    for(
        let z = 15;
        z > -210;
        z -= 15
    ){

        tree(-11,z);

        tree(11,z-6);

    }


    /* =========================================
       CHECKPOINT
    ========================================= */

    const checkpoint =
        new THREE.Group();


    const checkpointMaterial =
        new THREE.MeshStandardMaterial({
            color:0xffff00,
            emissive:0x665500
        });


    const ring =
        new THREE.Mesh(

            new THREE.TorusGeometry(
                5,
                .25,
                16,
                64
            ),

            checkpointMaterial

        );

    ring.rotation.y =
        Math.PI / 2;

    ring.position.y =
        4;

    checkpoint.add(ring);


    [-5,5].forEach(
        function(x){

            const pillar =
                new THREE.Mesh(

                    new THREE.BoxGeometry(
                        .4,
                        8,
                        .4
                    ),

                    checkpointMaterial

                );

            pillar.position.set(
                x,
                4,
                0
            );

            checkpoint.add(pillar);

        }
    );


    checkpoint.position.z =
        -100;

    scene.add(checkpoint);


    /* =========================================
       GAME STATE
    ========================================= */

    let speed = 0;

    let acceleration = 5;

    let running = false;

    let lastTime =
        performance.now();


    /* =========================================
       UI REFERENCES
    ========================================= */

    const goal =
        document.getElementById(
            "goal"
        );

    const create =
        document.getElementById(
            "create"
        );

    const enterVR =
        document.getElementById(
            "enterVR"
        );

    const panel =
        document.getElementById(
            "panel"
        );

    const missionTitle =
        document.getElementById(
            "missionTitle"
        );

    const intent =
        document.getElementById(
            "intent"
        );

    const missionInfo =
        document.getElementById(
            "missionInfo"
        );

    const speedText =
        document.getElementById(
            "speed"
        );

    const accText =
        document.getElementById(
            "acc"
        );

    const slider =
        document.getElementById(
            "acceleration"
        );

    const start =
        document.getElementById(
            "start"
        );

    const message =
        document.getElementById(
            "message"
        );

    const status =
        document.getElementById(
            "status"
        );


    /* =========================================
       VR SUPPORT
    ========================================= */

    if(
        navigator.xr
    ){

        navigator.xr
        .isSessionSupported(
            "immersive-vr"
        )
        .then(
            function(supported){

                if(supported){

                    enterVR.style.display =
                        "block";

                    status.textContent =
                        "🥽 VR headset detected.";

                }
                else{

                    status.textContent =
                        "📱 3D mode ready. Compatible VR hardware is required for immersive mode.";

                }

            }
        )
        .catch(
            function(){

                status.textContent =
                    "📱 3D mode ready.";

            }
        );

    }
    else{

        status.textContent =
            "📱 3D mode ready. WebXR is unavailable on this device.";

    }


    /* =========================================
       CREATE VR SESSION
    ========================================= */

    enterVR.addEventListener(
        "click",
        async function(){

            if(
                !navigator.xr
            ){

                alert(
                    "WebXR VR is not available on this device."
                );

                return;
            }


            try{

                const session =
                    await navigator.xr.requestSession(
                        "immersive-vr",
                        {
                            optionalFeatures:[
                                "local-floor",
                                "bounded-floor"
                            ]
                        }
                    );

                await renderer.xr.setSession(
                    session
                );

                status.textContent =
                    "🥽 You are now inside LifeSkill OS.";

            }
            catch(error){

                console.error(error);

                status.textContent =
                    "VR could not start on this device.";

            }

        }
    );


    /* =========================================
       EXPERIENCE ROUTER
    ========================================= */

    function understand(
        text
    ){

        const t =
            text.toLowerCase();


        if(
            t.includes("motion") ||
            t.includes("speed") ||
            t.includes("velocity") ||
            t.includes("acceleration") ||
            t.includes("force") ||
            t.includes("physics")
        ){

            return {

                subject:"Physics",

                experience:
                    "3D Motion Lab",

                mission:
                    "Master Motion",

                description:
                    "You are inside a virtual motion laboratory. Control acceleration and discover how motion changes through experimentation."

            };

        }


        if(
            t.includes("biology") ||
            t.includes("cell") ||
            t.includes("plant") ||
            t.includes("photosynthesis")
        ){

            return {

                subject:"Biology",

                experience:
                    "Virtual Biology World",

                mission:
                    "Explore Life",

                description:
                    "A future LifeSkill OS biology world will allow you to explore living systems through immersive simulation."

            };

        }


        if(
            t.includes("math") ||
            t.includes("algebra") ||
            t.includes("geometry") ||
            t.includes("triangle")
        ){

            return {

                subject:"Mathematics",

                experience:
                    "Interactive Math World",

                mission:
                    "Solve the Challenge",

                description:
                    "Enter a spatial mathematics environment where concepts become interactive challenges."

            };

        }


        if(
            t.includes("speaking") ||
            t.includes("communication") ||
            t.includes("presentation")
        ){

            return {

                subject:"Communication",

                experience:
                    "Virtual Speaking Arena",

                mission:
                    "Master Communication",

                description:
                    "Practice communication inside a simulated environment where virtual characters can respond to your decisions."

            };

        }


        return {

            subject:"Life Skill",

            experience:
                "Immersive Exploration",

            mission:
                "Begin Your Journey",

            description:
                "LifeSkill OS has created a starting experience for your goal."

        };

    }


    /* =========================================
       CREATE EXPERIENCE
    ========================================= */

    create.addEventListener(
        "click",
        function(){

            const text =
                goal.value.trim();


            if(!text){

                alert(
                    "Tell LifeSkill OS what you want to learn."
                );

                return;
            }


            const result =
                understand(text);


            panel.classList.remove(
                "hidden"
            );


            missionTitle.textContent =
                result.mission;


            intent.
